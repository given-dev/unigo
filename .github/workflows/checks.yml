name: Application checks
on:
  push:
  pull_request:
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    env:
      UNIGO_DB_HOST: 127.0.0.1
      UNIGO_DB_USER: root
      UNIGO_DB_PASS: root
      MYSQL_PWD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, ctype
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          find src public database scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check public/assets/js/app.js
          node --check public/assets/js/modules/seatmap.js
      - name: Initialize disposable database
        run: |
          mysql -h 127.0.0.1 -u root < database/schema.sql
          php database/seed.php
      - name: Booking regression
        run: php tests/booking.php
      - name: Seat selection regression
        run: |
          npm install --prefix "$RUNNER_TEMP/unigo-tests" jsdom
          NODE_PATH="$RUNNER_TEMP/unigo-tests/node_modules" node tests/seatmap.cjs
      - name: Role and full journey tests
        run: |
          php -S 127.0.0.1:8000 -t public scripts/router.php > "$RUNNER_TEMP/unigo-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PY'
          import socket,time
          for _ in range(50):
              try:
                  socket.create_connection(('127.0.0.1',8000),.2).close()
                  break
              except OSError:
                  time.sleep(.1)
          PY
          python tests/http_smoke.py
          python tests/journey.py
          python tests/authentication.py
